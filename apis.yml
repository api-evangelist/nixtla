aid: nixtla
name: Nixtla
description: >-
  Nixtla is an enterprise time-series intelligence platform built around TimeGPT,
  the first foundation model for time series. Through a simple REST API and Python/R
  SDKs it delivers zero-shot forecasting (no training data required), batch and
  real-time anomaly detection, cross-validation, and fine-tuning of the foundation
  model on customer data. The Nixtla Forecast API (OpenAPI 3.1) exposes /v2 endpoints
  for forecasting, anomaly detection, online anomaly detection, cross-validation,
  fine-tuning, and fine-tuned-model management, authenticated with a bearer API key.
  Nixtla also maintains a widely used open-source forecasting ecosystem
  (StatsForecast, NeuralForecast, MLForecast, HierarchicalForecast, CoreForecast)
  with tens of millions of downloads, offers cloud, self-hosted, and air-gapped
  deployments, ships MCP tools for agentic time-series workflows, and is SOC 2
  Type II compliant. Nixtla is backed by Techstars and True Ventures.
