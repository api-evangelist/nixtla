overlay: 1.0.0
info:
  title: API Evangelist enhancements for Nixtla Forecast API
  version: 1.0.0
extends: openapi/nixtla-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: nixtla
      x-apievangelist-category:
        - Time Series
        - Forecasting
        - Machine Learning
        - Anomaly Detection
        - Artificial Intelligence
      x-apievangelist-authentication: authentication/nixtla-authentication.yml
      x-apievangelist-conventions: conventions/nixtla-conventions.yml
      x-apievangelist-errors: errors/nixtla-problem-types.yml
  - target: $.servers
    update:
      - url: https://api.nixtla.io
        description: Production Nixtla Forecast API.
      - url: https://api-preview.nixtla.io
        description: Preview host for the TimeGPT-2 family of models.
